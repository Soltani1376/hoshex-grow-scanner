name: Validate app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check v4-core.js
          node --check v4-tasks.js
          node --check v4-ui.js
