name: Validate app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check v4-core.js
          node --check v4-tasks.js
          node --check v4-ui.js
          node --check v4-41.js
      - name: Check interface bindings
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          ui = pathlib.Path('v4-ui.js').read_text(encoding='utf-8')
          refine = pathlib.Path('v4-41.js').read_text(encoding='utf-8')
          ids = set(re.findall(r'id="([^"]+)"', html))
          refs = set(re.findall(r"\$\('([^']+)'\)", ui + '\n' + refine))
          missing = sorted(refs - ids)
          if missing:
              print('Missing DOM ids:', ', '.join(missing))
              sys.exit(1)
          loader = pathlib.Path('app.js').read_text(encoding='utf-8')
          for path in ['v4-core.js','v4-tasks.js','v4-ui.js','v4-41.js']:
              if path not in loader:
                  print('Loader does not reference', path)
                  sys.exit(1)
          print('DOM bindings and loader references look good.')
          PY
